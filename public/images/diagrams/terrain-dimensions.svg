<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schéma du terrain de football avec ses zones">
  <rect x="0" y="0" width="400" height="260" fill="#0e7a3a"/>
  <rect x="20" y="20" width="360" height="220" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="200" y1="20" x2="200" y2="240" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="200" cy="130" r="30" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="200" cy="130" r="2" fill="#ffffff"/>
  <!-- surface de réparation gauche -->
  <rect x="20" y="65" width="55" height="130" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <!-- surface de but gauche -->
  <rect x="20" y="100" width="20" height="60" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="86" cy="130" r="2" fill="#ffffff"/>
  <path d="M 75 105 A 30 30 0 0 1 75 155" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <!-- surface de réparation droite -->
  <rect x="325" y="65" width="55" height="130" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <!-- surface de but droite -->
  <rect x="360" y="100" width="20" height="60" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="314" cy="130" r="2" fill="#ffffff"/>
  <path d="M 325 105 A 30 30 0 0 0 325 155" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <!-- corners -->
  <path d="M 20 20 A 8 8 0 0 1 28 28" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M 380 20 A 8 8 0 0 0 372 28" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M 20 240 A 8 8 0 0 0 28 232" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M 380 240 A 8 8 0 0 1 372 232" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- buts -->
  <rect x="12" y="115" width="8" height="30" fill="none" stroke="#f5c400" stroke-width="2.5"/>
  <rect x="380" y="115" width="8" height="30" fill="none" stroke="#f5c400" stroke-width="2.5"/>
</svg>
