<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Situation de hors-jeu : joueur A2 est en position de hors-jeu">
  <rect x="0" y="0" width="400" height="220" fill="#0e7a3a"/>
  <rect x="0" y="20" width="10" height="180" fill="#f5c400"/>
  <rect x="10" y="60" width="80" height="100" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="340" y1="0" x2="340" y2="220" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="345" y="15" fill="#ffffff" font-size="12" font-family="Arial, sans-serif">ligne du ballon</text>

  <!-- defenders (bleu) -->
  <circle cx="250" cy="70" r="10" fill="#0b1e5b" stroke="#fff" stroke-width="2"/>
  <text x="245" y="55" fill="#ffffff" font-size="12" font-family="Arial, sans-serif">D1</text>
  <circle cx="220" cy="150" r="10" fill="#0b1e5b" stroke="#fff" stroke-width="2"/>
  <text x="200" y="170" fill="#ffffff" font-size="12" font-family="Arial, sans-serif">D2 (avant-dernier)</text>
  <line x1="220" y1="0" x2="220" y2="220" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- attackers (rouge) -->
  <circle cx="180" cy="110" r="10" fill="#e1000f" stroke="#fff" stroke-width="2"/>
  <text x="165" y="130" fill="#ffffff" font-size="12" font-family="Arial, sans-serif">A1 (passeur)</text>
  <circle cx="290" cy="110" r="10" fill="#e1000f" stroke="#fff" stroke-width="2"/>
  <text x="270" y="95" fill="#ffffff" font-size="12" font-family="Arial, sans-serif">A2</text>

  <!-- ball -->
  <circle cx="180" cy="110" r="4" fill="#f5c400"/>
  <path d="M 185 110 L 285 110" stroke="#f5c400" stroke-width="2" stroke-dasharray="5 4"/>
</svg>
